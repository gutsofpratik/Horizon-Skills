<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>入戏 · 书架</title>
<style>
  :root{--bg:#14110d;--text:#d9cfbf;--dim:#7d7160;--accent:#b98a4e;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--serif);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px;
    background-image:radial-gradient(90% 60% at 50% 0%,#1d1812 0%,var(--bg) 70%)}
  .fleuron{color:var(--accent);font-size:20px;letter-spacing:.6em;text-indent:.6em}
  h1{font-size:26px;letter-spacing:.3em;font-weight:600;margin:14px 0 6px}
  .sub{color:var(--dim);font-size:13px;letter-spacing:.12em;margin-bottom:44px;text-align:center;line-height:2}
  .shelf{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:760px}
  a.book{display:block;width:300px;text-decoration:none;color:var(--text);
    border:1px solid rgba(185,138,78,.28);background:rgba(32,26,19,.55);padding:26px 24px 22px;
    transition:border-color .25s,transform .25s}
  a.book:hover{border-color:var(--accent);transform:translateY(-3px)}
  .book .bt{font-size:19px;letter-spacing:.1em;margin-bottom:4px}
  .book .ba{color:var(--dim);font-size:12.5px;letter-spacing:.1em;margin-bottom:16px}
  .book .role{color:var(--accent);font-size:13.5px;line-height:1.9;border-top:1px solid rgba(185,138,78,.2);padding-top:12px}
  .book .q{color:var(--dim);font-size:13px;line-height:1.9;margin-top:8px;font-style:italic}
  footer{margin-top:52px;color:var(--dim);font-size:11.5px;letter-spacing:.15em;text-align:center;line-height:2}
</style>
</head>
<body>
  <div class="fleuron">❦</div>
  <h1>入 戏</h1>
  <div class="sub">把一本书，变成你能玩进去的一场戏。<br>选一本，从里面读。</div>
  <div class="shelf">
    <a class="book" href="metamorphosis/index.html">
      <div class="bt">变形记 · 厨房这一侧</div>
      <div class="ba">Franz Kafka · 1915</div>
      <div class="role">你是萨姆沙家十六岁的帮厨女孩</div>
      <div class="q">如果你不锁那扇门呢？</div>
    </a>
    <a class="book" href="pride/index.html">
      <div class="bt">傲慢与偏见 · 下房这一侧</div>
      <div class="ba">Jane Austen · 1813</div>
      <div class="role">你是朗博恩的管家 Hill 太太</div>
      <div class="q">这个家的体面，有一半锁在仆人房里。</div>
    </a>
  </div>
  <footer>入戏.skill · 均为公有领域原著的改编 · 每个选择都指得回原文</footer>
</body>
</html>
